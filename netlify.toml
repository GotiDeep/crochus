[build]
  command = "npx ng build"
  publish = "dist/crochus/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
