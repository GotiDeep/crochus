services:
  db:
    image: postgres:16-alpine
    container_name: crochus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crochus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crochus"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
